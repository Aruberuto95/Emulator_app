name: Native emulator validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      RUSTUP_TOOLCHAIN: "1.96.1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Prepare Rust and Python
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          python -m pip install -r requirements-test.txt
      - name: Install verified SDL2 SDK
        run: python install_sdl2.py --download-only
      - name: Build and test the native emulator
        run: python run_build_and_test.py --jobs 2
